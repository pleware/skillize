[project]
name = "skillize"
version = "0.1.0.dev0"
description = "Enable agent skills and say when they fire."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "PWare", email = "pawel@pware.ai" }]
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.18",
    "textual>=2.0",
]

[project.urls]
Homepage = "https://github.com/pleware/skillize"

[project.scripts]
skillize = "skillize.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/skillize"]

[tool.hatch.build.targets.wheel.force-include]
"schema/v1.json" = "skillize/data/v1.json"
"src/skillize/bundled/php7/SKILL.md" = "skillize/bundled/php7/SKILL.md"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
