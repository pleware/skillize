name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check src tests

      - name: Tests
        run: uv run pytest
