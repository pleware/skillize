# yaml-language-server: $schema=https://raw.githubusercontent.com/pleware/skillize/main/schema/v1.json
$schema: https://raw.githubusercontent.com/pleware/skillize/main/schema/v1.json
version: 1

# Optional. Listed at configure start, merged with unique GitHub `source`
# values from skills-lock.json.
sources:
  - addyosmani/agent-skills

skills:
  api-and-interface-design:
    enabled: true
    when: >
      Designing or changing a public HTTP or module contract.
  frontend-design:
    enabled: false
